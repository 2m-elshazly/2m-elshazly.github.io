<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الملف الشخصي | 2M Elshazly Store</title>
    
    <!-- خطوط و أيكونات -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.2/css/boxicons.min.css" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .profile-card {
            background: #1e1e1e;
            width: 100%;
            max-width: 480px;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
            border: 1px solid #333;
        }

        .back-home {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #0070d1;
            text-decoration: none;
            font-weight: 600;
            margin-bottom: 20px;
            font-size: 0.95rem;
        }

        .profile-img-container {
            position: relative;
            width: 90px;
            height: 90px;
            margin: 0 auto 15px auto;
        }

        #userAvatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #0070d1;
            display: none;
        }

        #userLetter {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: #0070d1;
            color: white;
            font-size: 2.2rem;
            font-weight: 700;
            display: none;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            border: 3px solid #0070d1;
        }

        .profile-info {
            margin-bottom: 20px;
        }

        .profile-info h2 {
            font-size: 1.3rem;
            margin-bottom: 5px;
            color: #fff;
        }

        .profile-info p {
            color: #aaa;
            font-size: 0.9rem;
            word-break: break-all;
        }

        /* قسم الطلبات */
        .orders-section {
            margin-top: 20px;
            text-align: right;
            border-top: 1px solid #2f2f2f;
            padding-top: 15px;
        }

        .orders-section h3 {
            font-size: 1.1rem;
            margin-bottom: 12px;
            color: #60a5fa;
        }

        .orders-list {
            max-height: 220px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-left: 5px;
        }

        .order-item {
            background: #151515;
            border: 1px solid #2f2f2f;
            padding: 12px;
            border-radius: 12px;
            font-size: 0.85rem;
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .order-status {
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .status-pending {
            background: rgba(234, 179, 8, 0.15);
            color: #facc15;
            border: 1px solid rgba(234, 179, 8, 0.3);
        }

        .status-completed {
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .order-games {
            color: #bbb;
            font-size: 0.8rem;
            line-height: 1.4;
        }

        .no-orders {
            color: #777;
            font-size: 0.9rem;
            text-align: center;
            padding: 15px 0;
        }

        .logout-btn {
            background-color: #d9534f;
            color: white;
            border: none;
            width: 100%;
            padding: 11px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 20px;
        }

        .logout-btn:hover {
            background-color: #c9302c;
        }

        .loading-text {
            color: #777;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <a href="index.html" class="back-home">
            <i class='bx bx-right-arrow-alt'></i> العودة للرئيسية
        </a>

        <div id="profileContent">
            <p class="loading-text">جاري تحميل بيانات الحساب...</p>
        </div>
    </div>

    <!-- جافاسكريبت لربط الفايربيس وعرض البيانات والطلبات -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";
        import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyBE2-qaGOOlmhn9QA01J5wizJ_CcMMh7qE",
          authDomain: "ifix-store-eecd9.firebaseapp.com",
          projectId: "ifix-store-eecd9",
          storageBucket: "ifix-store-eecd9.firebasestorage.app",
          messagingSenderId: "862863699996",
          appId: "1:862863699996:web:7af653f4de7d0baa0fafd9"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const profileContent = document.getElementById("profileContent");

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const displayName = user.displayName || "مستخدم 2M";
                const email = user.email || "لا يوجد بريد إلكتروني";
                const photoURL = user.photoURL;
                const firstLetter = displayName.trim().charAt(0).toUpperCase();

                // رسم الهيكل الأساسي للبروفايل مع مكان عرض الطلبات
                profileContent.innerHTML = `
                    <div class="profile-img-container">
                        <img id="userAvatar" src="" alt="صورة البروفايل">
                        <div id="userLetter">${firstLetter}</div>
                    </div>
                    <div class="profile-info">
                        <h2 id="userName">${displayName}</h2>
                        <p id="userEmail">${email}</p>
                    </div>

                    <div class="orders-section">
                        <h3>📦 طلباتك الحالية</h3>
                        <div id="userOrdersList" class="orders-list">
                            <p class="no-orders">جاري تحميل الطلبات...</p>
                        </div>
                    </div>

                    <button id="logoutBtn" class="logout-btn">
                        <i class='bx bx-log-out'></i> تسجيل خروج
                    </button>
                `;

                const avatarImg = document.getElementById("userAvatar");
                const letterDiv = document.getElementById("userLetter");

                if (photoURL) {
                    let cleanUrl = photoURL.replace("http://", "https://");
                    avatarImg.src = cleanUrl;
                    avatarImg.style.display = "block";
                    letterDiv.style.display = "none";
                } else {
                    avatarImg.style.display = "none";
                    letterDiv.style.display = "flex";
                }

                // جلب طلبات المستخدم من قاعدة البيانات (Firestore)
                try {
                    const q = query(collection(db, "orders"), where("userId", "==", user.uid));
                    const querySnapshot = await getDocs(q);
                    const ordersContainer = document.getElementById("userOrdersList");

                    if (querySnapshot.empty) {
                        ordersContainer.innerHTML = `<p class="no-orders">ليس لديك أي طلبات مسجلة حتى الآن.</p>`;
                    } else {
                        let ordersHtml = "";
                        querySnapshot.forEach((docSnap) => {
                            const order = docSnap.data();
                            const status = order.status || "pending";
                            const statusText = status === "completed" ? "مكتملة ✅" : "قيد التنفيذ ⏳";
                            const statusClass = status === "completed" ? "status-completed" : "status-pending";
                            
                            const gamesNames = Array.isArray(order.games) 
                                ? order.games.map(g => typeof g === 'string' ? g : g.name).join('، ') 
                                : "ألعاب متعددة";

                            ordersHtml += `
                                <div class="order-item">
                                    <div class="order-header">
                                        <span class="font-bold text-neutral-300">السعر: ${order.totalPrice || 0} ج.م</span>
                                        <span class="order-status ${statusClass}">${statusText}</span>
                                    </div>
                                    <div class="order-orders text-right">
                                        <span class="order-games">الألعاب: ${gamesNames}</span>
                                    </div>
                                </div>
                            `;
                        });
                        ordersContainer.innerHTML = ordersHtml;
                    }
                } catch (err) {
                    console.error("خطأ في جلب الطلبات:", err);
                    document.getElementById("userOrdersList").innerHTML = `<p class="no-orders">تعسّر تحميل الطلبات حالياً.</p>`;
                }

                // زر تسجيل الخروج
                document.getElementById("logoutBtn").addEventListener("click", async () => {
                    try {
                        await signOut(auth);
                        window.location.href = "index.html";
                    } catch (error) {
                        console.error("خطأ أثناء تسجيل الخروج:", error);
                    }
                });

            } else {
                window.location.href = "index.html";
            }
        });
    </script>
</body>
</html>
