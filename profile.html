<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الملف الشخصي | 2M Elshazly Store</title>
    
    <!-- خطوط و أيكونات -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.2/css/boxicons.min.css" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .profile-card {
            background: #1e1e1e;
            width: 100%;
            max-width: 420px;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
            border: 1px solid #333;
        }

        .back-home {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #0070d1;
            text-decoration: none;
            font-weight: 600;
            margin-bottom: 20px;
            font-size: 0.95rem;
        }

        .profile-img-container {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 20px auto;
        }

        #userAvatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #0070d1;
            display: none;
        }

        #userLetter {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #0070d1;
            color: white;
            font-size: 2.5rem;
            font-weight: 700;
            display: none;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            border: 3px solid #0070d1;
        }

        .profile-info {
            margin-bottom: 25px;
        }

        .profile-info h2 {
            font-size: 1.4rem;
            margin-bottom: 8px;
            color: #fff;
        }

        .profile-info p {
            color: #aaa;
            font-size: 0.95rem;
            word-break: break-all;
        }

        .logout-btn {
            background-color: #d9534f;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .logout-btn:hover {
            background-color: #c9302c;
        }

        .loading-text {
            color: #777;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <a href="index.html" class="back-home">
            <i class='bx bx-right-arrow-alt'></i> العودة للرئيسية
        </a>

        <div id="profileContent">
            <p class="loading-text">جاري تحميل بيانات الحساب...</p>
        </div>
    </div>

    <!-- جافاسكريبت لربط الفايربيس وعرض البيانات -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

        const firebaseConfig = {
          apiKey: "AIzaSyAeYbBx4yMyDCXhGAQS_X7KDhiKGPDZvWY",
          authDomain: "m-elshazly-e19a2.firebaseapp.com",
          projectId: "m-elshazly-e19a2",
          storageBucket: "m-elshazly-e19a2.firebasestorage.app",
          messagingSenderId: "1006926908276",
          appId: "1:1006926908276:web:ff1274fcea961f251afa21",
          measurementId: "G-HWXPWBVB75"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const profileContent = document.getElementById("profileContent");

        onAuthStateChanged(auth, (user) => {
            if (user) {
                // المستخدم مسجل دخول، عرض بياناته
                const displayName = user.displayName || "مستخدم 2M";
                const email = user.email || "لا يوجد بريد إلكتروني";
                const photoURL = user.photoURL;
                const firstLetter = displayName.trim().charAt(0).toUpperCase();

                profileContent.innerHTML = `
                    <div class="profile-img-container">
                        <img id="userAvatar" src="" alt="صورة البروفايل">
                        <div id="userLetter">${firstLetter}</div>
                    </div>
                    <div class="profile-info">
                        <h2 id="userName">${displayName}</h2>
                        <p id="userEmail">${email}</p>
                    </div>
                    <button id="logoutBtn" class="logout-btn">
                        <i class='bx bx-log-out'></i> تسجيل خروج
                    </button>
                `;

                const avatarImg = document.getElementById("userAvatar");
                const letterDiv = document.getElementById("userLetter");

                if (photoURL) {
                    let cleanUrl = photoURL.replace("http://", "https://");
                    avatarImg.src = cleanUrl;
                    avatarImg.style.display = "block";
                    letterDiv.style.display = "none";
                } else {
                    avatarImg.style.display = "none";
                    letterDiv.style.display = "flex";
                }

                // زر تسجيل الخروج
                document.getElementById("logoutBtn").addEventListener("click", async () => {
                    try {
                        await signOut(auth);
                        window.location.href = "index.html";
                    } catch (error) {
                        console.error("خطأ أثناء تسجيل الخروج:", error);
                    }
                });

            } else {
                // لو مفيش مستخدم مسجل دخول وحاول يفتح الصفحة، يرجع للرئيسية
                window.location.href = "index.html";
            }
        });
    </script>
</body>
</html>
