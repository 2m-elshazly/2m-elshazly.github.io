<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>الملف الشخصي | 2M Elshazly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<style type="text/css" media="all">
body{
    background:#121212;
    color:white;
    font-family:'Inter',sans-serif;
    margin:0;
    padding-bottom: 40px;
}
.profile-container{
    max-width:600px;
    margin:40px auto;
    padding:20px;
}
.profile-card{
    background:#1c1c1c;
    border:1px solid #2f2f2f;
    border-radius:25px;
    padding:30px;
    text-align:center;
}
.profile-photo{
    width:120px;
    height:120px;
    border-radius:50%;
    object-fit:cover;
    border:4px solid #ff8a00;
    margin-bottom:15px;
}
.profile-card h2{
    margin-bottom:5px;
}
.profile-card p{
    color:#9ca3af;
    margin: 5px 0;
}
.phone-box {
    margin-top: 15px;
    display: flex;
    gap: 10px;
    justify-content: center;
}
.phone-box input {
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid #444;
    background: #111;
    color: #fff;
    font-size: 14px;
    width: 60%;
}
.phone-box button {
    padding: 8px 15px;
    border-radius: 8px;
    border: none;
    background: #ff8a00;
    color: #fff;
    font-weight: bold;
    cursor: pointer;
}
.stats-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
    margin-top:20px;
}
.stat-card{
    background:#1c1c1c;
    border:1px solid #2f2f2f;
    border-radius:20px;
    padding:20px;
    text-align:center;
}
.stat-card span{
    font-size:2rem;
}
/* كارت نقاط الكاش باك والفلوس */
.cash-card {
    background: #1c1c1c;
    border: 1px solid #2f2f2f;
    border-radius: 20px;
    padding: 20px;
    text-align: center;
    grid-column: span 2;
}
/* كارت الألعاب المعدلة والهدايا */
.gift-card {
    grid-column: span 2;
    background: #1c1c1c;
    border: 1px solid #2f2f2f;
    border-radius: 20px;
    padding: 20px;
    text-align: center;
}
.gift-progress{
    margin-top:12px;
    padding:14px;
    background:#171717;
    border:1px solid #2f2f2f;
    border-radius:16px;
}
.gift-progress-top{
    display:flex;
    justify-content:space-between;
    gap:10px;
    color:#d1d5db;
    font-size:.85rem;
    font-weight:800;
    margin-bottom:8px;
}
.gift-progress-bar{
    width:100%;
    height:9px;
    border-radius:999px;
    overflow:hidden;
    background:#262626;
}
.gift-progress-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#ff9d2e,#ff8a00);
    transition:.4s;
}
.logout-btn{
    width:100%;
    margin-top:25px;
    height:55px;
    border:none;
    border-radius:15px;
    background:#ef4444;
    color:#fff;
    font-weight:800;
    cursor:pointer;
    transition: .2s;
} 
.logout-btn:hover {
    opacity: 0.9;
}
.back-link {
    display: block;
    text-align: center;
    color: #9ca3af;
    text-decoration: none;
    margin-top: 20px;
    font-weight: 600;
    font-size: 0.9rem;
    transition: color 0.2s;
}
.back-link:hover {
    color: #fff;
}
</style>
<body>
<div class="profile-container">

    <div class="profile-card">
        <img id="userPhoto" class="profile-photo" alt="صورة المستخدم">
        <h2 id="userDisplayName">...</h2>
        <p id="userEmail">...</p>
        
        <!-- خانة ربط رقم التليفون -->
        <div class="phone-box">
            <input type="text" id="phoneInput" placeholder="أدخل رقم هاتفك (01xxxxxxxxx)">
            <button id="savePhoneBtn">حفظ الرقم</button>
        </div>
    </div>

    <div class="stats-grid">

        <div class="stat-card">
            <span>❤️</span>
            <h3 id="favCount">0</h3>
            <p>المفضلة</p>
        </div>

        <div class="stat-card">
            <span>🛒</span>
            <h3 id="cartCountProfile">0</h3>
            <p>السلة</p>
        </div>

        <!-- كارت نقاط الفلوس (Cashback) -->
        <div class="cash-card">
            <span>💰</span>
            <h3 id="cash-points-count" style="color: #4ade80; margin: 5px 0;">0 جنيه / نقطة</h3>
            <p style="font-size: 13px; color: #9ca3af;">رصيد نقاط الفلوس والخصومات</p>
        </div>

        <!-- كارت نقاط الألعاب والهدايا -->
        <div class="gift-card">
            <span>🎮</span>
            <h3 id="game-points-count" style="color: #ff8a00; margin: 5px 0;">0 نقطة ألعاب</h3>
            <p style="font-size: 13px; color: #9ca3af;">كل ما تجمع نقاط كافية، استبدلها بلعبة هدية!</p>
            <div class="gift-progress">
                <div class="gift-progress-top">
                    <span>التقدم نحو اللعبة المجانية</span>
                    <span id="gift-progress-text">0 / 10</span>
                </div>
                <div class="gift-progress-bar">
                    <div id="gift-progress-fill" class="gift-progress-fill"></div>
                </div>
            </div>
        </div>

    </div>

    <button id="logoutBtn" class="logout-btn">
        🚪 تسجيل الخروج
    </button>

    <a href="index.html" class="back-link">
        ← العودة للصفحة الرئيسية
    </a>

</div>

<script type="module" charset="utf-8">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import {
  getAuth,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc,
  setDoc
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBE2-qaGOOlmhn9QA01J5wizJ_CcMMh7qE",
  authDomain: "ifix-store-eecd9.firebaseapp.com",
  projectId: "ifix-store-eecd9",
  storageBucket: "ifix-store-eecd9.firebasestorage.app",
  messagingSenderId: "862863699996",
  appId: "1:862863699996:web:7af653f4de7d0baa0fafd9"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUserId = null;
const TARGET_GAME_POINTS = 10; // عدد النقاط اللازمة للعبة الهدية

function updatePointsUI(cashVal, gameVal) {
    // تحديث نقاط الفلوس
    const cashEl = document.getElementById('cash-points-count');
    if(cashEl) cashEl.innerText = `${cashVal} نقطة`;

    // تحديث نقاط الألعاب وشريط التقدم
    const gameEl = document.getElementById('game-points-count');
    if(gameEl) gameEl.innerText = `${gameVal} نقطة ألعاب`;

    const progressText = document.getElementById('gift-progress-text');
    const progressFill = document.getElementById('gift-progress-fill');
    
    let currentProgress = gameVal % TARGET_GAME_POINTS;
    if(progressText) progressText.innerText = `${currentProgress} / ${TARGET_GAME_POINTS}`;
    if(progressFill) progressFill.style.width = `${Math.min((currentProgress / TARGET_GAME_POINTS) * 100, 100)}%`;
}

onAuthStateChanged(auth, async(user)=>{
    if(!user){
        window.location.href = "index.html";
        return;
    }

    currentUserId = user.uid;

    document.getElementById("userPhoto").src = user.photoURL || "https://via.placeholder.com/120";
    document.getElementById("userDisplayName").innerText = user.displayName || "مستخدم 2M Elshazly";
    document.getElementById("userEmail").innerText = user.email || "";

    try {
        // جلب المفضلة
        const favSnap = await getDoc(doc(db, "favorites", user.uid));
        let favCount = 0;
        if(favSnap.exists()){
            favCount = (favSnap.data().games || []).length;
        }
        document.getElementById("favCount").innerText = favCount;

        // جلب البيانات من جدول users (النقاط ورقم التليفون)
        const userSnap = await getDoc(doc(db, "users", user.uid));
        if(userSnap.exists()) {
            const data = userSnap.data();
            const cashPoints = Number(data.cashPoints || 0);
            const gamePoints = Number(data.gamePoints || 0);
            
            updatePointsUI(cashPoints, gamePoints);

            if(data.phone) {
                document.getElementById("phoneInput").value = data.phone;
            }
        }

    } catch (error) {
        console.error("خطأ في جلب بيانات المستخدم:", error);
    }

    // جلب عدد عناصر السلة من الـ LocalStorage
    const cart = JSON.parse(localStorage.getItem("ifix_cart")) || [];
    document.getElementById("cartCountProfile").innerText = cart.length;
});

// حفظ رقم التليفون في قاعدة البيانات
document.getElementById("savePhoneBtn").addEventListener("click", async () => {
    const phoneVal = document.getElementById("phoneInput").value.trim();
    if(!phoneVal) {
        alert("من فضلك اكتب رقم تليفون صحيح");
        return;
    }

    if(!currentUserId) return;

    try {
        await setDoc(doc(db, "users", currentUserId), {
            phone: phoneVal
        }, { merge: true });

        alert("تم حفظ رقم التليفون بنجاح! 🎉");
    } catch (err) {
        console.error(err);
        alert("حدث خطأ أثناء الحفظ، حاول مرة أخرى.");
    }
});

document.getElementById("logoutBtn").addEventListener("click", async()=>{
    await signOut(auth);
    localStorage.removeItem("ifix_cart");
    window.location.href = "index.html";
});
</script>
</body>
</html>
