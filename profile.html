<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الملف الشخصي | 2M Elshazly Store</title>
    
    <!-- خطوط و أيكونات -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.2/css/boxicons.min.css" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .profile-card {
            background: #1e1e1e;
            width: 100%;
            max-width: 420px;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
            border: 1px solid #333;
        }

        .back-home {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #0070d1;
            text-decoration: none;
            font-weight: 600;
            margin-bottom: 20px;
            font-size: 0.95rem;
        }

        .profile-img-container {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 20px auto;
        }

        #userAvatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #0070d1;
            display: none;
        }

        #userLetter {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #0070d1;
            color: white;
            font-size: 2.5rem;
            font-weight: 700;
            display: none;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            border: 3px solid #0070d1;
        }

        .profile-info {
            margin-bottom: 25px;
        }

        .profile-info h2 {
            font-size: 1.4rem;
            margin-bottom: 8px;
            color: #fff;
        }

        .profile-info p {
            color: #aaa;
            font-size: 0.95rem;
            word-break: break-all;
        }

        .logout-btn {
            background-color: #d9534f;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .logout-btn:hover {
            background-color: #c9302c;
        }

        .loading-text {
            color: #777;
            font-size: 1.1rem;
        }

        .stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}
        .stat-box{background:#121212;border:1px solid #333;border-radius:14px;padding:14px}
        .stat-box .label{color:#999;font-size:.78rem}
        .stat-box .value{font-size:1.25rem;font-weight:800;margin-top:4px}
        .gift-card{margin:18px 0;background:linear-gradient(145deg,#171717,#222);border:1px solid #0070d1;border-radius:16px;padding:18px;text-align:right}
        .gift-card h3{margin-bottom:7px;color:#60a5fa}
        .gift-card p{color:#aaa;font-size:.86rem;line-height:1.7;margin-bottom:12px}
        .gift-status{display:inline-block;padding:5px 9px;border-radius:20px;background:#123b1e;color:#7ee2a8;font-size:.76rem;margin-bottom:10px}
        .gift-actions{display:grid;grid-template-columns:1fr;gap:8px}
        .gift-actions button{border:0;border-radius:10px;padding:11px;font-family:inherit;font-weight:700;cursor:pointer}
        .discount-btn{background:#0070d1;color:#fff}
        .games-btn{background:#2b2b2b;color:#fff;border:1px solid #444 !important}
        .later-btn{background:transparent;color:#aaa;border:1px solid #444 !important}
        .orders-card{margin:18px 0;text-align:right}
        .orders-title{font-size:1.1rem;margin-bottom:10px}
        .order-item{background:#121212;border:1px solid #333;border-radius:13px;padding:12px;margin-bottom:9px}
        .order-item strong{display:block;margin-bottom:5px}
        .order-meta{color:#999;font-size:.78rem;line-height:1.7}
        .customer-badge{display:inline-block;margin-top:8px;padding:5px 9px;border-radius:20px;background:#252525;color:#ddd;font-size:.75rem}
        .profile-section-btn{display:block;text-decoration:none;text-align:center;background:#252525;color:#fff;padding:11px;border-radius:10px;margin-top:10px}
    </style>
</head>
<body>

    <div class="profile-card">
        <a href="index.html" class="back-home">
            <i class='bx bx-right-arrow-alt'></i> العودة للرئيسية
        </a>

        <div id="profileContent">
            <p class="loading-text">جاري تحميل بيانات الحساب...</p>
        </div>
    </div>

    <!-- جافاسكريبت لربط الفايربيس وعرض البيانات -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, runTransaction, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyAeYbBx4yMyDCXhGAQS_X7KDhiKGPDZvWY",
          authDomain: "m-elshazly-e19a2.firebaseapp.com",
          projectId: "m-elshazly-e19a2",
          storageBucket: "m-elshazly-e19a2.firebasestorage.app",
          messagingSenderId: "1006926908276",
          appId: "1:1006926908276:web:ff1274fcea961f251afa21",
          measurementId: "G-HWXPWBVB75"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const profileContent = document.getElementById("profileContent");

        async function chooseGiftFromProfile(type) {
            const user = auth.currentUser;
            if (!user) return;

            const userRef = doc(db, "users", user.uid);

            try {
                await runTransaction(db, async (transaction) => {
                    const snap = await transaction.get(userRef);
                    if (!snap.exists()) throw new Error("حساب العميل غير موجود");

                    const d = snap.data();
                    const status = d.welcomeGiftStatus || "used";
                    if (status !== "available" && status !== "deferred") {
                        throw new Error("الهدية تم اختيارها أو استخدامها بالفعل");
                    }

                    transaction.set(userRef, {
                        welcomeGiftStatus: type === "discount20" ? "discount20" : "free10_pending",
                        welcomeGiftType: type,
                        welcomeGiftGames: [],
                        updatedAt: serverTimestamp()
                    }, {merge:true});
                });

                if (type === "free10") {
                    window.location.href = "games.html?welcomeGift=free10";
                } else {
                    await loadProfile(user);
                    alert("🎉 تم تفعيل خصم 20% لأول طلب لك في 2M Elshazly!");
                }
            } catch (error) {
                console.error(error);
                alert(error.message || "حصل خطأ أثناء اختيار العرض.");
            }
        }

        async function loadProfile(user) {
            const userRef = doc(db, "users", user.uid);
            const snap = await getDoc(userRef);

            if (!snap.exists()) {
                profileContent.innerHTML = `<p class="loading-text">لم يتم العثور على بيانات الحساب.</p>`;
                return;
            }

            const d = snap.data();
            const displayName = user.displayName || d.name || "مستخدم 2M";
            const email = user.email || d.email || "لا يوجد بريد إلكتروني";
            const photoURL = user.photoURL || d.photoURL || "";
            const firstLetter = displayName.trim().charAt(0).toUpperCase();

            const points = Number(d.points || 0);
            const lifetime = Number(d.lifetimePoints ?? d.totalPointsEarned ?? points);
            const level = d.level || (lifetime >= 10000 ? "VIP" : "NORMAL");
            const customerType = d.customerType === "shop" ? "🏪 صاحب محل" : d.customerType === "home" ? "🏠 عميل بيت" : "نوع العميل غير محدد";

            let giftHTML = "";
            const giftStatus = d.welcomeGiftStatus || "used";

            if (giftStatus === "available" || giftStatus === "deferred") {
                giftHTML = `
                  <div class="gift-card">
                    <span class="gift-status">${giftStatus === "deferred" ? "العرض محفوظ لك" : "عرض ترحيبي متاح"}</span>
                    <h3>🎁 هديتك من 2M Elshazly</h3>
                    <p>لو لسه ما اخترتش هديتك، تقدر تختار من هنا: خصم 20% على أول طلب أو 10 ألعاب مجانية.</p>
                    <div class="gift-actions">
                      <button class="discount-btn" id="profileDiscountBtn">🏷️ خصم 20% على أول طلب</button>
                      <button class="games-btn" id="profileGamesBtn">🎮 10 ألعاب مجانية</button>
                    </div>
                  </div>`;
            } else if (giftStatus === "discount20") {
                giftHTML = `
                  <div class="gift-card" style="border-color:#1f8f4d">
                    <span class="gift-status">الخصم مفعل</span>
                    <h3>🏷️ خصم 20% متاح</h3>
                    <p>خصمك الترحيبي محفوظ لأول طلب.</p>
                  </div>`;
            } else if (giftStatus === "free10_pending") {
                giftHTML = `
                  <div class="gift-card" style="border-color:#1f8f4d">
                    <span class="gift-status">الهدية محفوظة</span>
                    <h3>🎮 10 ألعاب مجانية</h3>
                    <p>هدية التسجيل الخاصة بك محفوظة.</p>
                  </div>`;
            }

            profileContent.innerHTML = `
                <div class="profile-img-container">
                    <img id="userAvatar" src="" alt="صورة البروفايل">
                    <div id="userLetter">${firstLetter}</div>
                </div>

                <div class="profile-info">
                    <h2 id="userName">${displayName}</h2>
                    <p id="userEmail">${email}</p>
                    <span class="customer-badge">${customerType}</span>
                </div>

                <div class="stats-grid">
                    <div class="stat-box"><div class="label">النقاط الحالية</div><div class="value">🎯 ${points}</div></div>
                    <div class="stat-box"><div class="label">إجمالي النقاط</div><div class="value">🏆 ${lifetime}</div></div>
                    <div class="stat-box"><div class="label">المستوى</div><div class="value">${level === "VIP" ? "👑 VIP" : "⭐ NORMAL"}</div></div>
                    <div class="stat-box"><div class="label">رقم الهاتف</div><div class="value" style="font-size:.9rem">${d.whatsapp || "غير مسجل"}</div></div>
                </div>

                ${giftHTML}

                <div class="orders-card">
                  <div class="orders-title">🛒 طلباتي</div>
                  <div id="ordersList"><p class="loading-text">جاري تحميل الطلبات...</p></div>
                </div>

                <a href="index.html" class="profile-section-btn">العودة للرئيسية</a>
                <button id="logoutBtn" class="logout-btn" style="margin-top:10px;">
                    <i class='bx bx-log-out'></i> تسجيل خروج
                </button>
            `;

            const avatarImg = document.getElementById("userAvatar");
            const letterDiv = document.getElementById("userLetter");
            if (photoURL) {
                avatarImg.src = photoURL.replace("http://", "https://");
                avatarImg.style.display = "block";
                letterDiv.style.display = "none";
            } else {
                avatarImg.style.display = "none";
                letterDiv.style.display = "flex";
            }

            document.getElementById("logoutBtn").addEventListener("click", async () => {
                await signOut(auth);
                window.location.href = "index.html";
            });

            document.getElementById("profileDiscountBtn")?.addEventListener("click", () => chooseGiftFromProfile("discount20"));
            document.getElementById("profileGamesBtn")?.addEventListener("click", () => chooseGiftFromProfile("free10"));

            // عرض الطلبات لو كانت محفوظة داخل users.orders.
            // لا نفترض بنية مختلفة لقاعدة البيانات.
            const ordersList = document.getElementById("ordersList");
            const orders = Array.isArray(d.orders) ? d.orders : [];
            if (!orders.length) {
                ordersList.innerHTML = `<div class="order-item"><span class="order-meta">لا توجد طلبات مسجلة حتى الآن.</span></div>`;
            } else {
                ordersList.innerHTML = orders.slice().reverse().map((o, i) => `
                    <div class="order-item">
                      <strong>طلب #${orders.length - i}</strong>
                      <div class="order-meta">
                        الحالة: ${o.status || "قيد المراجعة"}<br>
                        الألعاب: ${o.itemsCount ?? o.gameCount ?? "—"}<br>
                        الإجمالي: ${o.total ?? o.totalPrice ?? "—"} جنيه
                      </div>
                    </div>
                `).join("");
            }
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                try {
                    await loadProfile(user);
                } catch (error) {
                    console.error(error);
                    profileContent.innerHTML = `<p class="loading-text">حصل خطأ في تحميل بيانات الحساب.</p>`;
                }
            } else {
                window.location.href = "index.html";
            }
        });

    </script>
</body>
</html>
